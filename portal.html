<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NHM अयोध्या — एकीकृत अधिकारी समीक्षा पोर्टल</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4 bg-slate-900">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-7 space-y-5">
      <div class="text-center border-b pb-4">
        <span class="inline-block bg-teal-100 text-teal-900 text-[11px] font-bold px-3 py-1 rounded-full mb-2">
          जिला स्वास्थ्य समिति (DHS), अयोध्या
        </span>
        <h1 class="text-lg font-bold text-slate-900">NHM अधिकारी समीक्षा पोर्टल</h1>
        <p class="text-xs text-slate-500 mt-1">एक लॉगिन से सभी कार्यक्रमों की प्रगति एवं भुगतान देखें</p>
      </div>

      <form id="hubLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">पंजीकृत मोबाइल नंबर</label>
          <input type="tel" id="loginMobile" maxlength="10" required placeholder="10 अंकों का मोबाइल नंबर"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:border-teal-700 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">4-अंकों का PIN</label>
          <input type="password" id="loginPin" maxlength="4" required placeholder="••••"
            class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm tracking-widest focus:border-teal-700 focus:outline-none" />
        </div>
        <div id="loginError" class="hidden p-2.5 bg-red-50 text-red-700 border border-red-200 rounded-lg text-xs font-semibold"></div>
        <button type="submit" id="loginBtn" class="w-full py-2.5 bg-teal-800 hover:bg-teal-900 text-white font-bold rounded-xl text-sm transition">
          पोर्टल खोलें →
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN COMMAND HUB -->
  <div id="hubApp" class="hidden">
    <header class="bg-slate-900 text-white shadow-md">
      <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-3">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold">NHM अयोध्या — एकीकृत कार्यक्रम समीक्षा डैशबोर्ड</h1>
            <span id="roleBadge" class="text-[10px] bg-amber-400 text-slate-950 font-extrabold px-2.5 py-0.5 rounded-full">DISTRICT</span>
          </div>
          <p id="officerInfo" class="text-xs text-slate-300 mt-0.5"></p>
        </div>
        <button id="logoutBtn" class="px-3 py-1.5 bg-red-800 hover:bg-red-700 text-xs font-semibold rounded-lg">लॉगआउट</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-5">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-2">
        <p id="scopeBanner" class="text-xs font-bold text-slate-700"></p>
        <span class="text-[11px] text-slate-500">किसी भी कार्यक्रम कार्ड पर क्लिक कर विस्तृत समीक्षा खोलें</span>
      </div>

      <div id="modulesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoqdHg4LAPSfhsU0gLbyAtSp7uIUUg0UQ",
      authDomain: "asha-payment.firebaseapp.com",
      databaseURL: "https://asha-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "asha-payment",
      storageBucket: "asha-payment.firebasestorage.app",
      messagingSenderId: "117935142167",
      appId: "1:117935142167:web:e1d5bb9da9f567594eb352",
      measurementId: "G-43YGRC5CKL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const MODULES = [
      {
        title: "ASHA Payment समीक्षा",
        desc: "आशा कार्यकर्ताओं की प्रोत्साहन राशि, शून्य भुगतान (₹0), PFMS Break और प्रोग्राम-वार एक्टिविटी विश्लेषण।",
        url: "dashboard.html",
        access: "ALL",
        badge: "Community Process",
        color: "border-teal-600 text-teal-800 bg-teal-50"
      },
      {
        title: "JSY Payment एवं सत्यापन",
        desc: "संस्थागत प्रसव, PIN Verification, JSY Verification, MOIC स्वीकृति एवं भुगतान पाइपलाइन पेंडेंसी।",
        url: "jsy-dashboard.html",
        access: "ALL",
        badge: "Maternal Health",
        color: "border-indigo-600 text-indigo-800 bg-indigo-50"
      },
      {
        title: "ABHA Progress एवं Scan-Share",
        desc: "ब्लॉक एवं स्वास्थ्य केंद्रवार ABHA ID निर्माण लक्ष्य बनाम उपलब्धि और OPD Scan & Share प्रगति।",
        url: "abha-dashboard.html",
        access: "ALL",
        badge: "Digital Health",
        color: "border-emerald-600 text-emerald-800 bg-emerald-50"
      },
      {
        title: "Master Data Uploader (Admin)",
        desc: "ASHA Payment, JSY Payment और ABHA Progress की मासिक Excel शीट अपलोड एवं PIN रीसेट।",
        url: "admin.html",
        access: "DISTRICT",
        badge: "Admin Only",
        color: "border-slate-700 text-slate-800 bg-slate-100"
      },
      {
        title: "अधिकारी एक्सेस नियंत्रण",
        desc: "जनपद एवं सभी 11 ब्लॉकों के MOIC, BPM, BAM के मोबाइल नंबर व लॉगिन अनुमति प्रबंधन।",
        url: "officers-admin.html",
        access: "DISTRICT",
        badge: "Access Control",
        color: "border-purple-600 text-purple-800 bg-purple-50"
      }
    ];

    let currentOfficer = null;

    document.getElementById("hubLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const mob = document.getElementById("loginMobile").value.replace(/\D/g, "").slice(-10);
      const pin = document.getElementById("loginPin").value.trim();
      const errBox = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");

      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "सत्यापन हो रहा है...";

      try {
        const snap = await get(ref(db, `asha_portal_v2/officers/${mob}`));
        if (!snap.exists()) throw new Error("यह मोबाइल नंबर पंजीकृत नहीं है।");
        const off = snap.val();
        if (off.active === false) throw new Error("आपका एक्सेस निष्क्रिय है।");
        if (String(off.pin) !== pin) throw new Error("गलत PIN दर्ज किया गया है।");

        currentOfficer = { mobile: mob, ...off };
        sessionStorage.setItem("nhm_ayodhya_officer", JSON.stringify(currentOfficer));
        renderHub();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "पोर्टल खोलें →";
      }
    });

    const saved = sessionStorage.getItem("nhm_ayodhya_officer");
    if (saved) {
      currentOfficer = JSON.parse(saved);
      renderHub();
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("nhm_ayodhya_officer");
      location.reload();
    });

    function renderHub() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("hubApp").classList.remove("hidden");

      const isDistrict = currentOfficer.role === "DISTRICT";
      document.getElementById("roleBadge").textContent = isDistrict ? "DISTRICT LEVEL" : `BLOCK: ${currentOfficer.block}`;
      document.getElementById("officerInfo").textContent = `${currentOfficer.name} (${currentOfficer.designation}) • मो. ${currentOfficer.mobile}`;
      document.getElementById("scopeBanner").textContent = isDistrict
        ? "कार्यक्षेत्र: जनपद अयोध्या (समस्त 11 विकास खंड एवं जिला चिकित्सालय)"
        : `कार्यक्षेत्र: विकास खंड ${currentOfficer.block}`;

      const list = MODULES.filter(m => isDistrict || m.access === "ALL");
      document.getElementById("modulesGrid").innerHTML = list.map(m => `
        <a href="${m.url}" class="group bg-white p-5 rounded-2xl border border-slate-200 hover:border-teal-600 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4">
          <div class="space-y-2">
            <span class="inline-block text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${m.color}">${m.badge}</span>
            <h2 class="text-base font-bold text-slate-900 group-hover:text-teal-800">${m.title}</h2>
            <p class="text-xs text-slate-600 leading-relaxed">${m.desc}</p>
          </div>
          <div class="pt-3 border-t text-xs font-bold text-teal-800 flex justify-between items-center">
            <span>डैशबोर्ड खोलें</span>
            <span class="group-hover:translate-x-1 transition">→</span>
          </div>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
